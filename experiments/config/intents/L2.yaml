# L2 Device Location Verification intents (stage 05).
# Server version: v3.0.0. Client versions used in Stage 3: v2.0.0, v1.0.0, v0.2.0, v0.1.0.
# 30 main intents (m01–m30) + 10 pilot intents (p01–p10).
# prompt_half: true for odd-numbered main intents (m01, m03, ..., m29).
# pilot_round: A for p01–p05; B for p06–p10.
# Area constraints: radius >= 2000 m (v0.1.0 `accuracy` minimum is 2 km, 07b A3); centre inside coverage box (lat 35–60, lon -12–25).
# maxAge: v0.1.0 has no maxAge field; use only where the client version supports it.
# verificationResult at v0.1.0 is a boolean; PARTIAL / UNKNOWN are unrepresentable.
# Backend rule: at most 2 NAI-only intents.
# World outcome distribution: TRUE, FALSE, PARTIAL, unknown location.
# Fact rules (07b A6): `client_facts` hold only what the client itself knows and the intent text does not say:
#   - a second device identifier (NAI-only intents), or
#   - a preference that decides between alternatives the client's interface allows.
# A fact never states the world's state (no "cannot locate", "unreachable", "expired"), never names a server-only
# field, and never quotes a profile or service limit. Every fact is consistent with the gold call.

api: L2
server_version: v3.0.0
operation: verifyLocation

# Coverage box from world.py service.yaml (lat 35–60, lon -12–25)
# Devices with known location that fit within the coverage box:
# D01: Berlin 52.52,13.41, acc 800m -> area 1000m radius -> likely TRUE (d + 800 <= 1000 for nearby center)
# D02: Prague 50.08,14.43, acc 1500m -> area 2000m radius -> PARTIAL
# D04: Paris 48.86,2.35, acc 4000m -> area 3000m radius -> FALSE (acc > radius)
# D05: Madrid 40.41,-3.72, acc 1200m -> area 2000m radius -> TRUE
# D06: Rome 41.90,12.50, acc 800m -> area 1000m radius -> TRUE
# D07: Amsterdam 52.38,4.90, acc 1500m -> area 2000m radius -> PARTIAL
# D08: Warsaw 52.23,21.02, acc 2500m -> area 1500m radius -> FALSE
# D09: Budapest 47.50,19.04, acc 4000m -> area 2000m radius -> FALSE (acc too big)
# D10: Zurich 47.37,8.53, acc 1200m -> area 2000m radius -> TRUE (d + 1200 <= 2000 for exact center)
# D12: Dublin 53.36,-6.27, acc 1500m -> area 2000m radius -> PARTIAL
# D13: Bonn 50.73,7.11, acc 2500m -> area 1500m radius -> FALSE
# D14: Berlin 52.52,13.41 (D14 at 52.524, 13.405), acc 4000m -> area 2000m -> FALSE
# D16: Vienna 48.21,16.38, acc 800m -> area 1500m radius -> TRUE
# D17: Paris 48.86,2.35 (D17 at 48.864, 2.346), acc 1500m -> area 2000m -> PARTIAL
# D22: Budapest 47.51,19.03, acc 1500m -> area 2000m -> PARTIAL
# D24: Lisbon 38.73,-9.14, acc 4000m -> area 3000m -> FALSE (acc > radius)
# D25: Dublin 53.34,-6.27, acc 1200m -> area 2000m -> TRUE
# D26: Bonn 50.74,7.11, acc 800m -> area 1000m -> TRUE
# Devices with no location: D03, D11, D19, D27 -> UNABLE_TO_LOCATE

main:
  - id: m01
    prompt_half: true
    intent_text: "Check if phone +9901000001 is located within 2 km of 52.520, 13.411 in Berlin."
    params:
      device_id: D01
      identifier: phone_number
      area: {center: {latitude: 52.520, longitude: 13.411}, radius: 2000}
    world_ref: {device: D01}
    client_facts: []
    provenance: authored

  - id: m02
