# L1 Device Reachability Status intents (stage 05).
# Server version: v1.0.0. Client versions used in Stage 3: v0.5.1, v0.6.0.
# 30 main intents (m01–m30) + 10 pilot intents (p01–p10).
# prompt_half: true for odd-numbered main intents (m01, m03, m05, ..., m29).
# pilot_round: A for p01–p05; B for p06–p10.
# Device identifier types: phone, IPv4+port, IPv6, networkAccessIdentifier.
# Reachability states: DATA_SMS, DATA_ONLY, SMS_ONLY, NONE.
# World constraint: creates/reads use D01–D30; NAI-only gets declined.
# Fact rules (07b A6): `client_facts` hold only what the client itself knows and the intent text does not say:
#   - a second device identifier (NAI-only intents), or
#   - a preference that decides between alternatives the client's interface allows.
# A fact never states the world's state (no "cannot locate", "unreachable", "expired"), never names a server-only
# field, and never quotes a profile or service limit. Every fact is consistent with the gold call.

api: L1
server_version: v1.0.0
operation: retrieveReachability

main:
  - id: m01
    prompt_half: true
    intent_text: "Is the phone +9901000001 reachable right now?"
    params:
      device_id: D01
      identifier: phone_number
    world_ref: {device: D01}
    client_facts: []
    provenance: authored

