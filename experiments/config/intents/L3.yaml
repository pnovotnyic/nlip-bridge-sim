# L3 Quality-on-Demand intents (stage 05).
# Server version: v1.1.0. Client versions used in Stage 3: v0.8.1, v0.9.0, v0.10.0, v0.11.0, v1.0.0.
# 30 main intents (m01–m30) + 10 pilot intents (p01–p10).
# prompt_half: true for odd-numbered main intents (m01, m03, ..., m29).
# pilot_round: A for p01–p05; B for p06–p10.
# Composition: 22 creates (m01–m22), 4 gets (m23–m26), 4 deletes (m27–m30).
# World constraint: creates use devices D01–D30; gets/deletes use world sessions (D31–D40).
# Profile names from v0.8.1: QOS_E, QOS_S, QOS_M, QOS_L (same in all versions).
# Duration rules: QOS_E max 1800s, QOS_S max 86400s, QOS_M max 7200s, QOS_L max 14400s.
# v0.8.1 native requests without duration default to 86400s, above QOS_E/QOS_M/QOS_L max.
# NAI-only: at most 2 intents; both have a second identifier in client_facts.
# Fact rules (07b A6): `client_facts` hold only what the client itself knows and the intent text does not say:
#   - a second device identifier (NAI-only intents), or
#   - a preference that decides between alternatives the client's interface allows.
# A fact never states the world's state (no "cannot locate", "unreachable", "expired"), never names a server-only
# field, and never quotes a profile or service limit. Every fact is consistent with the gold call.

api: L3
server_version: v1.1.0

main:
  # --- CREATES (m01–m22) ---

  - id: m01
    prompt_half: true
    operation: createSession
    intent_text: "Give the phone +9901000001 a stable low-latency connection to the game server at 198.51.100.20 for the next hour."
    params:
      device_id: D01
      identifier: phone_number
      application_server: {ipv4Address: "198.51.100.20"}
      profile: QOS_E
      duration_s: 3600
      gold_profile: QOS_M   # QOS_E max is 1800s; gold call uses QOS_M which allows 1 hour
    world_ref: {device: D01}
    client_facts:
      - {fact: "duration_preference", value: "If QOS_E cannot be given for the full hour, use QOS_M for the full time rather than a shorter session."}
    provenance: authored

