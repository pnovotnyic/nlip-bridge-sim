      type: object
      required: [sessionId, duration, qosStatus]
      properties:
        sessionId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        duration:
          type: integer
        device:
          type: object
        applicationServer:
          type: object
        qosProfile:
          type: string
        qosStatus:
          type: string
          enum: [REQUESTED, AVAILABLE, UNAVAILABLE]
        statusInfo:
