# Stage 08 pilot, RITS slice (R2-R4). Same parts, task filters, prompts and conditions as pilot.yaml,
# with the rungs restricted to R2-R4; pilot-r1.yaml has the R1 slice. The two together are pilot.yaml.
#   Part A: R2-R4, P2, NLIP and NLIP-0 on 45 round-A instances = 270 sessions
#   Part B: R3, P1 and P3, NLIP only, on the 15 L3 round-A instances = 30 sessions
# Run with: uv run python -m nlipeval.runner.run --matrix config/runs/pilot-rits.yaml
# The run ID is generated (<UTC YYYYMMDD-HHMM>-stage8-pilot-rits); resume with --run-id <that run ID>.

run_id: null
label: pilot-rits
stage: stage8
attempt: 1

parts:
  - name: A
    task_filter:
      apis: [L1, L2, L3]
      pilot_round: A
    rungs: [R2, R3, R4]
    prompts: [P2]
    conditions: [NLIP, NLIP-0]
  - name: B
    task_filter:
      apis: [L3]
      pilot_round: A
    rungs: [R3]
    prompts: [P1, P3]
    conditions: [NLIP]

concurrency:
  R2: 8
  R3: 8
  R4: 8

budget_calls: 20000
