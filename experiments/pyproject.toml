[project]
name = "nlipeval"
version = "0.1.0"
description = "NLIP evaluation: experimental code, runs and scoring"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai==3.50.0",
    "httpx==0.28.1",
    "tenacity==9.2.1",
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "jsonschema==4.26.0",
    "openapi-core==0.23.1",
    "pyyaml==6.0.3",
    "pandas==3.1.1",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "matplotlib==3.11.2",
    "pytest==9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nlipeval"]

[tool.pytest.ini_options]
testpaths = ["tests", "stage1/tests"]
pythonpath = ["."]
markers = [
    "live: needs network and credentials",
    "e2e: end-to-end tests that start the backends",
    "smoke: smoke tests that need live models",
]
