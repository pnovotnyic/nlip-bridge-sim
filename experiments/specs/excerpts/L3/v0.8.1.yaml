                            \    - 2001:db8:85a3:8d3::0/64\n    - 2001:db8:85a3:8d3::/64\n"
                      description: User equipment identifier
                    asId:
                      type: object
                      minProperties: 1
                      properties:
                        ipv4addr:
                          type: string
                          format: ipv4
                          pattern: ^([01]?\d\d?|2[0-4]\d|25[0-5])(?:\.(?:[01]?\d\d?|2[0-4]\d|25[0-5])){3}(\/([0-9]|[1-2][0-9]|3[0-2]))?$
                          example: 192.168.0.1/24
                          description: "IPv4 address may be specified in form <address/mask> as:\n  - address - an IPv4 number\
