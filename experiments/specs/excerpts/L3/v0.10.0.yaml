openapi: 3.0.3
info:
  title: QoD for enhanced communication
  version: 0.10.0
paths:
  /sessions:
    post:
      tags:
      - QoS Sessions
      summary: Creates a new session
      description: 'Create QoS Session to manage latency/throughput priorities


        If the qosStatus in the API response is "AVAILABLE" and a notification callback is provided the client will receive
        in addition to the response a

        `QOS_STATUS_CHANGED` event notification with `qosStatus` as `AVAILABLE`.


        If the `qosStatus` in the API response is `REQUESTED`, the client will receive either

        - a `QOS_STATUS_CHANGED` event notification with `qosStatus` as `AVAILABLE` after the network notifies that it has
        created the requested session, or

        - a `QOS_STATUS_CHANGED` event notification with `qosStatus` as `UNAVAILABLE` and `statusInfo` as `NETWORK_TERMINATED`
        after the network notifies that it has failed to provide the requested session.


        A `QOS_STATUS_CHANGED` event notification with `qosStatus` as `UNAVAILABLE` will also be send if the network terminates
        the session before the requested duration expired


        NOTE: in case of a `QOS_STATUS_CHANGED` event with `qosStatus` as `UNAVAILABLE` and `statusInfo` as `NETWORK_TERMINATED`
        the resources of the QoS session

        are not directly released, but will get deleted automatically at earliest 360 seconds after the event.

        This behavior allows clients which are not receiving notification events but are polling to get the session information
        with

        the `qosStatus` `UNAVAILABLE` and `statusInfo` `NETWORK_TERMINATED`. Before a client can attempt to create a new QoD
        session

        for the same device and flow period they must release the session resources with an explicit `delete` operation if
        not yet automatically deleted.

        '
      operationId: createSession
      requestBody:
        description: Parameters to create a new session
        content:
          application/json:
            schema:
              description: Attributes required to create a session
              type: object
              properties:
                duration:
                  description: "Session duration in seconds. Maximal value of 24 hours is used if not set.\nAfter session\
                    \ is expired the, client will receive a `QOS_STATUS_CHANGED` event with\n - `qosStatus` as `UNAVAILABLE`,\
                    \ and,\n - `statusInfo` as `DURATION_EXPIRED`.\nSee notification callback.\n"
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 86400
                  default: 86400
                  example: 86400
                device:
                  description: 'End-user equipment able to connect to a mobile network. Examples of devices include smartphones
                    or IoT sensors/actuators.


                    The developer can choose to provide the below specified device identifiers:


                    * `ipv4Address`

                    * `ipv6Address`

                    * `phoneNumber`

                    * `networkAccessIdentifier`


                    NOTE: the MNO might support only a subset of these options. The API invoker can provide multiple identifiers
                    to be compatible across different MNOs. In this case the identifiers MUST belong to the same device

                    '
                  type: object
                  properties:
                    phoneNumber:
                      description: A public identifier addressing a telephone subscription. In mobile networks it corresponds
                        to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally
                        unique it has to be formatted in international format, according to E.164 standard, optionally prefixed
                        with '+'.
                      type: string
                      pattern: ^\+?[0-9]{5,15}$
                      example: '123456789'
                    networkAccessIdentifier:
                      description: A public identifier addressing a subscription in a mobile network. In 3GPP terminology,
                        it corresponds to the GPSI formatted with the External Identifier ({Local Identifier}@{Domain Identifier}).
                        Unlike the telephone number, the network access identifier is not subjected to portability ruling
                        in force, and is individually managed by each operator.
                      type: string
                      example: 123456789@domain.com
                    ipv4Address:
                      type: object
                      description: 'The device should be identified by either the public (observed) IP address and port as
                        seen by the application server, or the private (local) and any public (observed) IP addresses in use
                        by the device (this information can be obtained by various means, for example from some DNS servers).


                        If the allocated and observed IP addresses are the same (i.e. NAT is not in use) then  the same address
                        should be specified for both publicAddress and privateAddress.


                        If NAT64 is in use, the device should be identified by its publicAddress and publicPort, or separately
                        by its allocated IPv6 address (field ipv6Address of the Device object)


                        In all cases, publicAddress must be specified, along with at least one of either privateAddress or
                        publicPort, dependent upon which is known. In general, mobile devices cannot be identified by their
                        public IPv4 address alone.

                        '
                      properties:
                        publicAddress:
                          description: A single IPv4 address with no subnet mask
                          type: string
                          format: ipv4
                          example: 84.125.93.10
                        privateAddress:
                          description: A single IPv4 address with no subnet mask
                          type: string
                          format: ipv4
                          example: 84.125.93.10
                        publicPort:
                          description: TCP or UDP port number
                          type: integer
                          minimum: 0
                          maximum: 65535
                      anyOf:
                      - required:
                        - publicAddress
                        - privateAddress
                      - required:
                        - publicAddress
                        - publicPort
                      example:
                        publicAddress: 84.125.93.10
                        publicPort: 59765
                    ipv6Address:
                      description: 'The device should be identified by the observed IPv6 address, or by any single IPv6 address
                        from within the subnet allocated to the device (e.g. adding ::0 to the /64 prefix).


                        The session shall apply to all IP flows between the device subnet and the specified application server,
                        unless further restricted by the optional parameters devicePorts or applicationServerPorts.

                        '
                      type: string
                      format: ipv6
                      example: 2001:db8:85a3:8d3:1319:8a2e:370:7344
                  minProperties: 1
                applicationServer:
                  description: 'A server hosting backend applications to deliver some business logic to clients.


                    The developer can choose to provide the below specified device identifiers:


                    * `ipv4Address`

                    * `ipv6Address`

                    '
                  type: object
                  properties:
                    ipv4Address:
                      type: string
                      example: 192.168.0.1/24
                      description: "IPv4 address may be specified in form <address/mask> as:\n  - address - an IPv4 number\
                        \ in dotted-quad form 1.2.3.4. Only this exact IP number will match the flow control rule.\n  - address/mask\
                        \ - an IP number as above with a mask width of the form 1.2.3.4/24.\n    In this case, all IP numbers\
                        \ from 1.2.3.0 to 1.2.3.255 will match. The bit width MUST be valid for the IP version.\n"
                    ipv6Address:
                      type: string
                      example: 2001:db8:85a3:8d3:1319:8a2e:370:7344
                      description: "IPv6 address may be specified in form <address/mask> as:\n  - address - The /128 subnet\
                        \ is optional for single addresses:\n    - 2001:db8:85a3:8d3:1319:8a2e:370:7344\n    - 2001:db8:85a3:8d3:1319:8a2e:370:7344/128\n\
                        \  - address/mask - an IP v6 number with a mask:\n    - 2001:db8:85a3:8d3::0/64\n    - 2001:db8:85a3:8d3::/64\n"
                  minProperties: 1
                devicePorts:
                  description: The ports used locally by the device for flows to which the requested QoS profile should apply.
                    If omitted, then the qosProfile will apply to all flows between the device and the specified application
                    server address and ports
                  allOf:
                  - type: object
                    minProperties: 1
                    properties:
                      ranges:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          required:
                          - from
                          - to
                          properties:
                            from:
                              description: TCP or UDP port number
                              type: integer
                              minimum: 0
                              maximum: 65535
                            to:
                              description: TCP or UDP port number
                              type: integer
                              minimum: 0
                              maximum: 65535
                      ports:
                        type: array
                        minItems: 1
                        items:
                          description: TCP or UDP port number
                          type: integer
                          minimum: 0
                          maximum: 65535
                    example:
                      ranges:
                      - from: 5010
                        to: 5020
                      ports:
                      - 5060
                      - 5070
                applicationServerPorts:
                  description: A list of single ports or port ranges on the application server
                  allOf:
                  - type: object
                    minProperties: 1
                    properties:
                      ranges:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          required:
                          - from
                          - to
                          properties:
                            from:
                              description: TCP or UDP port number
                              type: integer
                              minimum: 0
                              maximum: 65535
                            to:
                              description: TCP or UDP port number
                              type: integer
                              minimum: 0
                              maximum: 65535
                      ports:
                        type: array
                        minItems: 1
                        items:
                          description: TCP or UDP port number
                          type: integer
                          minimum: 0
                          maximum: 65535
                    example:
                      ranges:
                      - from: 5010
                        to: 5020
                      ports:
                      - 5060
                      - 5070
                qosProfile:
                  description: "A unique name for identifying a specific QoS profile.\nThis may follow different formats depending\
                    \ on the service providers implementation.\nSome options addresses:\n  - A UUID style string\n  - Support\
                    \ for predefined profiles QOS_S, QOS_M, QOS_L, and QOS_E\n  - A searchable descriptive name\n"
                  type: string
                  example: QCI_1_voice
                  minLength: 3
                  maxLength: 256
                  format: string
                  pattern: ^[a-zA-Z0-9_.-]+$
                webhook:
                  type: object
                  required:
                  - notificationUrl
                  properties:
                    notificationUrl:
                      type: string
                      format: uri
                      example: https://application-server.com
                      description: Allows asynchronous delivery of session related events
                    notificationAuthToken:
                      type: string
                      minLength: 20
                      maxLength: 256
                      example: c8974e592c2fa383d4a3960714
                      description: Authentication token for callback API
              required:
              - device
              - applicationServer
              - qosProfile
        required: true
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                description: Session related information.
                allOf:
                - description: Attributes required to create a session
                  type: object
                  properties:
                    duration:
                      description: "Session duration in seconds. Maximal value of 24 hours is used if not set.\nAfter session\
                        \ is expired the, client will receive a `QOS_STATUS_CHANGED` event with\n - `qosStatus` as `UNAVAILABLE`,\
                        \ and,\n - `statusInfo` as `DURATION_EXPIRED`.\nSee notification callback.\n"
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 86400
                      default: 86400
                      example: 86400
                    device:
                      description: 'End-user equipment able to connect to a mobile network. Examples of devices include smartphones
                        or IoT sensors/actuators.


                        The developer can choose to provide the below specified device identifiers:


                        * `ipv4Address`

                        * `ipv6Address`

                        * `phoneNumber`

                        * `networkAccessIdentifier`


                        NOTE: the MNO might support only a subset of these options. The API invoker can provide multiple identifiers
                        to be compatible across different MNOs. In this case the identifiers MUST belong to the same device

                        '
                      type: object
                      properties:
                        phoneNumber:
                          description: A public identifier addressing a telephone subscription. In mobile networks it corresponds
                            to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally
                            unique it has to be formatted in international format, according to E.164 standard, optionally
                            prefixed with '+'.
                          type: string
                          pattern: ^\+?[0-9]{5,15}$
                          example: '123456789'
                        networkAccessIdentifier:
                          description: A public identifier addressing a subscription in a mobile network. In 3GPP terminology,
                            it corresponds to the GPSI formatted with the External Identifier ({Local Identifier}@{Domain
                            Identifier}). Unlike the telephone number, the network access identifier is not subjected to portability
                            ruling in force, and is individually managed by each operator.
                          type: string
                          example: 123456789@domain.com
                        ipv4Address:
                          type: object
                          description: 'The device should be identified by either the public (observed) IP address and port
                            as seen by the application server, or the private (local) and any public (observed) IP addresses
                            in use by the device (this information can be obtained by various means, for example from some
                            DNS servers).


                            If the allocated and observed IP addresses are the same (i.e. NAT is not in use) then  the same
                            address should be specified for both publicAddress and privateAddress.


                            If NAT64 is in use, the device should be identified by its publicAddress and publicPort, or separately
                            by its allocated IPv6 address (field ipv6Address of the Device object)


                            In all cases, publicAddress must be specified, along with at least one of either privateAddress
                            or publicPort, dependent upon which is known. In general, mobile devices cannot be identified
                            by their public IPv4 address alone.

                            '
                          properties:
                            publicAddress:
                              description: A single IPv4 address with no subnet mask
                              type: string
                              format: ipv4
                              example: 84.125.93.10
                            privateAddress:
                              description: A single IPv4 address with no subnet mask
                              type: string
                              format: ipv4
                              example: 84.125.93.10
                            publicPort:
                              description: TCP or UDP port number
                              type: integer
                              minimum: 0
                              maximum: 65535
                          anyOf:
                          - required:
                            - publicAddress
                            - privateAddress
                          - required:
                            - publicAddress
                            - publicPort
                          example:
                            publicAddress: 84.125.93.10
                            publicPort: 59765
                        ipv6Address:
                          description: 'The device should be identified by the observed IPv6 address, or by any single IPv6
                            address from within the subnet allocated to the device (e.g. adding ::0 to the /64 prefix).


                            The session shall apply to all IP flows between the device subnet and the specified application
                            server, unless further restricted by the optional parameters devicePorts or applicationServerPorts.

                            '
                          type: string
                          format: ipv6
                          example: 2001:db8:85a3:8d3:1319:8a2e:370:7344
                      minProperties: 1
                    applicationServer:
                      description: 'A server hosting backend applications to deliver some business logic to clients.


                        The developer can choose to provide the below specified device identifiers:


                        * `ipv4Address`

                        * `ipv6Address`

                        '
                      type: object
                      properties:
                        ipv4Address:
                          type: string
                          example: 192.168.0.1/24
                          description: "IPv4 address may be specified in form <address/mask> as:\n  - address - an IPv4 number\
                            \ in dotted-quad form 1.2.3.4. Only this exact IP number will match the flow control rule.\n \
                            \ - address/mask - an IP number as above with a mask width of the form 1.2.3.4/24.\n    In this\
                            \ case, all IP numbers from 1.2.3.0 to 1.2.3.255 will match. The bit width MUST be valid for the\
                            \ IP version.\n"
                        ipv6Address:
                          type: string
                          example: 2001:db8:85a3:8d3:1319:8a2e:370:7344
                          description: "IPv6 address may be specified in form <address/mask> as:\n  - address - The /128 subnet\
                            \ is optional for single addresses:\n    - 2001:db8:85a3:8d3:1319:8a2e:370:7344\n    - 2001:db8:85a3:8d3:1319:8a2e:370:7344/128\n\
                            \  - address/mask - an IP v6 number with a mask:\n    - 2001:db8:85a3:8d3::0/64\n    - 2001:db8:85a3:8d3::/64\n"
                      minProperties: 1
                    devicePorts:
                      description: The ports used locally by the device for flows to which the requested QoS profile should
                        apply. If omitted, then the qosProfile will apply to all flows between the device and the specified
                        application server address and ports
                      allOf:
                      - type: object
                        minProperties: 1
                        properties:
                          ranges:
                            type: array
                            minItems: 1
                            items:
                              type: object
                              required:
                              - from
                              - to
                              properties:
                                from:
                                  description: TCP or UDP port number
                                  type: integer
                                  minimum: 0
                                  maximum: 65535
                                to:
                                  description: TCP or UDP port number
                                  type: integer
                                  minimum: 0
                                  maximum: 65535
                          ports:
                            type: array
                            minItems: 1
                            items:
                              description: TCP or UDP port number
                              type: integer
                              minimum: 0
                              maximum: 65535
                        example:
                          ranges:
                          - from: 5010
                            to: 5020
                          ports:
                          - 5060
                          - 5070
                    applicationServerPorts:
                      description: A list of single ports or port ranges on the application server
                      allOf:
                      - type: object
                        minProperties: 1
                        properties:
                          ranges:
                            type: array
                            minItems: 1
                            items:
                              type: object
                              required:
                              - from
                              - to
                              properties:
                                from:
                                  description: TCP or UDP port number
                                  type: integer
                                  minimum: 0
                                  maximum: 65535
                                to:
                                  description: TCP or UDP port number
                                  type: integer
                                  minimum: 0
                                  maximum: 65535
                          ports:
                            type: array
                            minItems: 1
                            items:
                              description: TCP or UDP port number
                              type: integer
                              minimum: 0
                              maximum: 65535
                        example:
                          ranges:
                          - from: 5010
                            to: 5020
                          ports:
                          - 5060
                          - 5070
                    qosProfile:
                      description: "A unique name for identifying a specific QoS profile.\nThis may follow different formats\
                        \ depending on the service providers implementation.\nSome options addresses:\n  - A UUID style string\n\
                        \  - Support for predefined profiles QOS_S, QOS_M, QOS_L, and QOS_E\n  - A searchable descriptive\
                        \ name\n"
                      type: string
                      example: QCI_1_voice
                      minLength: 3
                      maxLength: 256
                      format: string
                      pattern: ^[a-zA-Z0-9_.-]+$
                    webhook:
                      type: object
                      required:
                      - notificationUrl
                      properties:
                        notificationUrl:
                          type: string
                          format: uri
                          example: https://application-server.com
                          description: Allows asynchronous delivery of session related events
                        notificationAuthToken:
                          type: string
                          minLength: 20
                          maxLength: 256
                          example: c8974e592c2fa383d4a3960714
                          description: Authentication token for callback API
                  required:
                  - device
                  - applicationServer
                  - qosProfile
                - type: object
                  properties:
                    sessionId:
                      description: Session ID in UUID format
                      type: string
                      format: uuid
                    startedAt:
                      type: integer
                      example: 1639479600
                      description: Timestamp of session start in seconds since Unix epoch
                      format: int64
                    expiresAt:
                      type: integer
                      example: 1639566000
                      description: Timestamp of session expiration if the session was not deleted, in seconds since Unix epoch
                      format: int64
                    qosStatus:
                      description: 'The current status of the requested QoS session. The status can be one of the following:

                        * `REQUESTED` - QoS has been requested by creating a session

                        * `AVAILABLE` - The requested QoS has been provided by the network

                        * `UNAVAILABLE` - The requested QoS cannot be provided by the network due to some reason

                        '
                      type: string
                      enum:
                      - REQUESTED
                      - AVAILABLE
                      - UNAVAILABLE
                    messages:
                      type: array
                      items:
                        type: object
                        properties:
                          severity:
                            description: Message severity
                            type: string
                            enum:
                            - INFO
                            - WARNING
                          description:
                            description: Detailed message text
                            type: string
                        required:
                        - severity
                        - description
                  required:
                  - sessionId
                  - duration
                  - startedAt
                  - expiresAt
                  - qosStatus
        '400':
          description: Invalid input for createSession operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code returned along with this error response
                  code:
                    type: string
                    description: Code given to this error
                  message:
                    type: string
                    description: Detailed error description
                required:
                - status
                - code
                - message
              examples:
                Generic400:
                  summary: Some parameter combinations or parameter values provided are not schema compliant
                  value:
                    status: 400
                    code: INVALID_ARGUMENT
                    message: Schema validation failed at  ...
                DeviceMissing:
                  summary: Device must be specified
                  value:
                    status: 400
                    code: INVALID_ARGUMENT
                    message: 'Expected property is missing: device'
                InsufficientDeviceProperties:
                  summary: Device must be identified by at least one parameter
                  value:
                    status: 400
                    code: INVALID_ARGUMENT
                    message: 'Insufficient properties specified: device'
                InconsistentDeviceProperties:
                  summary: Device parameters provided identify different devices
                  value:
                    status: 400
                    code: INVALID_ARGUMENT
                    message: 'Multiple inconsistent parameters specified: device'
                CannotIdentifyDevice:
                  summary: No device can be identified from provided parameters
                  value:
                    status: 400
                    code: INVALID_ARGUMENT
                    message: 'Unable to identify device from specified parameters: device'
                InvalidDevicePublicPortValue:
                  summary: Invalid port specified for device public port
                  value:
                    status: 400
                    code: OUT_OF_RANGE
                    message: 'Invalid port value specified: device.ipv4Address.publicPort'
                ApplicationServerMissing:
                  summary: Application server must be specified
                  value:
                    status: 400
                    code: INVALID_ARGUMENT
                    message: 'Expected property is missing: applicationServer'
                QoSProfileMissing:
                  summary: Required QoS profile must be specified
                  value:
                    status: 400
                    code: INVALID_ARGUMENT
                    message: 'Expected property is missing: qosProfile'
                InvalidDevicePortsRanges:
                  summary: Invalid port ranges specified for devicePorts
                  value:
                    status: 400
                    code: OUT_OF_RANGE
                    message: 'Invalid port ranges specified: devicePorts'
                DurationOutOfRangeForQoSProfile:
                  summary: The requested duration is out of the allowed range for the specific QoS profile
                  value:
                    status: 400
                    code: OUT_OF_RANGE
                    message: The requested duration is out of the allowed range for the specific QoS profile
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code returned along with this error response
                  code:
                    type: string
                    description: Code given to this error
                  message:
                    type: string
                    description: Detailed error description
                required:
                - status
                - code
                - message
              example:
                status: 401
                code: UNAUTHENTICATED
                message: 'Authorization failed: ...'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code returned along with this error response
                  code:
                    type: string
                    description: Code given to this error
                  message:
                    type: string
                    description: Detailed error description
                required:
                - status
                - code
                - message
              example:
                status: 403
                code: PERMISSION_DENIED
                message: 'Operation not allowed: ...'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code returned along with this error response
                  code:
                    type: string
                    description: Code given to this error
                  message:
                    type: string
                    description: Detailed error description
                required:
                - status
                - code
                - message
              example:
                status: 409
                code: CONFLICT
                message: Another session is created for the same device
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code returned along with this error response
                  code:
                    type: string
                    description: Code given to this error
                  message:
                    type: string
                    description: Detailed error description
                required:
                - status
                - code
                - message
              example:
                status: 500
                code: INTERNAL
                message: 'Internal server error: ...'
        '501':
          description: Not Implemented
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code returned along with this error response
                  code:
                    type: string
                    description: Code given to this error
                  message:
                    type: string
                    description: Detailed error description
                required:
                - status
                - code
                - message
              example:
                status: 501
                code: NOT_IMPLEMENTED
                message: Service not implemented for the specified user device
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: HTTP status code returned along with this error response
                  code:
                    type: string
                    description: Code given to this error
                  message:
                    type: string
                    description: Detailed error description
                required:
                - status
                - code
                - message
              example:
                status: 503
                code: UNAVAILABLE
                message: Service unavailable
      callbacks:
        notifications:
          '{$request.body#/webhook/notificationUrl}':
            post:
              summary: Session notifications callback
  /sessions/{sessionId}:
    get:
      tags:
      - QoS Sessions
      summary: Get QoS session information
      description: Querying for QoS session resource information details
      operationId: getSession
      parameters:
      - name: sessionId
        in: path
        description: Session ID that was obtained from the createSession operation
        required: true
        schema:
          description: Session ID in UUID format
          type: string
          format: uuid
      responses:
        '200':
          description: Contains information about active session
          content:
            application/json:
              schema:
                description: Session related information.
                allOf:
                - description: Attributes required to create a session
                  type: object
                  properties:
                    duration:
                      description: "Session duration in seconds. Maximal value of 24 hours is used if not set.\nAfter session\
                        \ is expired the, client will receive a `QOS_STATUS_CHANGED` event with\n - `qosStatus` as `UNAVAILABLE`,\
                        \ and,\n - `statusInfo` as `DURATION_EXPIRED`.\nSee notification callback.\n"
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 86400
                      default: 86400
                      example: 86400
                    device:
                      description: 'End-user equipment able to connect to a mobile network. Examples of devices include smartphones
                        or IoT sensors/actuators.


                        The developer can choose to provide the below specified device identifiers:


                        * `ipv4Address`

                        * `ipv6Address`

                        * `phoneNumber`

                        * `networkAccessIdentifier`


                        NOTE: the MNO might support only a subset of these options. The API invoker can provide multiple identifiers
                        to be compatible across different MNOs. In this case the identifiers MUST belong to the same device

                        '
                      type: object
                      properties:
                        phoneNumber:
                          description: A public identifier addressing a telephone subscription. In mobile networks it corresponds
                            to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally
                            unique it has to be formatted in international format, according to E.164 standard, optionally
                            prefixed with '+'.
                          type: string
                          pattern: ^\+?[0-9]{5,15}$
                          example: '123456789'
                        networkAccessIdentifier:
                          description: A public identifier addressing a subscription in a mobile network. In 3GPP terminology,
                            it corresponds to the GPSI formatted with the External Identifier ({Local Identifier}@{Domain
                            Identifier}). Unlike the telephone number, the network access identifier is not subjected to portability
                            ruling in force, and is individually managed by each operator.
                          type: string
                          example: 123456789@domain.com
                        ipv4Address:
                          type: object
                          description: 'The device should be identified by either the public (observed) IP address and port
                            as seen by the application server, or the private (local) and any public (observed) IP addresses
                            in use by the device (this information can be obtained by various means, for example from some
                            DNS servers).


                            If the allocated and observed IP addresses are the same (i.e. NAT is not in use) then  the same
                            address should be specified for both publicAddress and privateAddress.


                            If NAT64 is in use, the device should be identified by its publicAddress and publicPort, or separately
                            by its allocated IPv6 address (field ipv6Address of the Device object)


                            In all cases, publicAddress must be specified, along with at least one of either privateAddress
                            or publicPort, dependent upon which is known. In general, mobile devices cannot be identified
                            by their public IPv4 address alone.

                            '
                          properties:
                            publicAddress:
                              description: A single IPv4 address with no subnet mask
                              type: string
                              format: ipv4
                              example: 84.125.93.10
                            privateAddress:
                              description: A single IPv4 address with no subnet mask
                              type: string
                              format: ipv4
                              example: 84.125.93.10
                            publicPort:
                              description: TCP or UDP port number
                              type: integer
                              minimum: 0
                              maximum: 65535
                          anyOf:
                          - required:
                            - publicAddress
                            - privateAddress
                          - required:
                            - publicAddress
                            - publicPort
                          example:
                            publicAddress: 84.125.93.10
                            publicPort: 59765
                        ipv6Address:
                          description: 'The device should be identified by the observed IPv6 address, or by any single IPv6
                            address from within the subnet allocated to the device (e.g. adding ::0 to the /64 prefix).


                            The session shall apply to all IP flows between the device subnet and the specified application
                            server, unless further restricted by the optional parameters devicePorts or applicationServerPorts.

                            '
                          type: string
                          format: ipv6
                          example: 2001:db8:85a3:8d3:1319:8a2e:370:7344
                      minProperties: 1
                    applicationServer:
                      description: 'A server hosting backend applications to deliver some business logic to clients.


                        The developer can choose to provide the below specified device identifiers:


                        * `ipv4Address`

                        * `ipv6Address`

                        '
                      type: object
                      properties:
                        ipv4Address:
                          type: string
                          example: 192.168.0.1/24
                          description: "IPv4 address may be specified in form <address/mask> as:\n  - address - an IPv4 number\
                            \ in dotted-quad form 1.2.3.4. Only this exact IP number will match the flow control rule.\n \
                            \ - address/mask - an IP number as above with a mask width of the form 1.2.3.4/24.\n    In this\
                            \ case, all IP numbers from 1.2.3.0 to 1.2.3.255 will match. The bit width MUST be valid for the\
                            \ IP version.\n"
                        ipv6Address:
                          type: string
                          example: 2001:db8:85a3:8d3:1319:8a2e:370:7344
                          description: "IPv6 address may be specified in form <address/mask> as:\n  - address - The /128 subnet\
                            \ is optional for single addresses:\n    - 2001:db8:85a3:8d3:1319:8a2e:370:7344\n    - 2001:db8:85a3:8d3:1319:8a2e:370:7344/128\n\
                            \  - address/mask - an IP v6 number with a mask:\n    - 2001:db8:85a3:8d3::0/64\n    - 2001:db8:85a3:8d3::/64\n"
                      minProperties: 1
                    devicePorts:
                      description: The ports used locally by the device for flows to which the requested QoS profile should
                        apply. If omitted, then the qosProfile will apply to all flows between the device and the specified
                        application server address and ports
                      allOf:
                      - type: object
                        minProperties: 1
                        properties:
                          ranges:
                            type: array
                            minItems: 1
                            items:
                              type: object
                              required:
                              - from
                              - to
                              properties:
                                from:
                                  description: TCP or UDP port number
                                  type: integer
                                  minimum: 0
                                  maximum: 65535
                                to:
                                  description: TCP or UDP port number
                                  type: integer
                                  minimum: 0
                                  maximum: 65535
                          ports:
                            type: array
                            minItems: 1
                            items:
                              description: TCP or UDP port number
                              type: integer
                              minimum: 0
                              maximum: 65535
                        example:
                          ranges:
                          - from: 5010
                            to: 5020
                          ports:
                          - 5060
                          - 5070
                    applicationServerPorts:
                      description: A list of single ports or port ranges on the application server
                      allOf:
                      - type: object
                        minProperties: 1
                        properties:
                          ranges:
                            type: array
                            minItems: 1
                            items:
                              type: object
                              required:
                              - from
                              - to
                              properties:
                                from:
                                  description: TCP or UDP port number
                                  type: integer
                                  minimum: 0
                                  maximum: 65535
                                to:
                                  description: TCP or UDP port number
                                  type: integer
                                  minimum: 0
                                  maximum: 65535
                          ports:
                            type: array
                            minItems: 1
                            items:
                              description: TCP or UDP port number
                              type: integer
                              minimum: 0
                              maximum: 65535
                        example:
                          ranges:
                          - from: 5010
                            to: 5020
                          ports:
                          - 5060
                          - 5070
                    qosProfile:
                      description: "A unique name for identifying a specific QoS profile.\nThis may follow different formats\
                        \ depending on the service providers implementation.\nSome options addresses:\n  - A UUID style string\n\
                        \  - Support for predefined profiles QOS_S, QOS_M, QOS_L, and QOS_E\n  - A searchable descriptive\
                        \ name\n"
                      type: string
                      example: QCI_1_voice
                      minLength: 3
                      maxLength: 256
                      format: string
                      pattern: ^[a-zA-Z0-9_.-]+$
                    webhook:
                      type: object
                      required:
                      - notificationUrl
                      properties:
                        notificationUrl:
                          type: string
                          format: uri
                          example: https://application-server.com
                          description: Allows asynchronous delivery of session related events
                        notificationAuthToken:
                          type: string
                          minLength: 20
                          maxLength: 256
                          example: c8974e592c2fa383d4a3960714
                          description: Authentication token for callback API
                  required:
                  - device
                  - applicationServer
                  - qosProfile
                - type: object
                  properties:
                    sessionId:
                      description: Session ID in UUID format
                      type: string
                      format: uuid
                    startedAt:
                      type: integer
                      example: 1639479600
                      description: Timestamp of session start in seconds since Unix epoch
                      format: int64
                    expiresAt:
                      type: integer
                      example: 1639566000
                      description: Timestamp of session expiration if the session was not deleted, in seconds since Unix epoch
                      format: int64
                    qosStatus:
                      description: 'The current status of the requested QoS session. The status can be one of the following:

                        * `REQUESTED` - QoS has been requested by creating a session

                        * `AVAILABLE` - The requested QoS has been provided by the network

                        * `UNAVAILABLE` - The requested QoS cannot be provided by the network due to some reason

                        '
                      type: string
                      enum:
                      - REQUESTED
                      - AVAILABLE
                      - UNAVAILABLE
                    messages:
                      type: array
                      items:
                        type: object
                        properties:
                          severity:
                            description: Message severity
                            type: string
                            enum:
                            - INFO
                            - WARNING
                          description:
                            description: Detailed message text
                            type: string
                        required:
                        - severity
                        - description
                  required:
                  - sessionId
                  - duration
                  - startedAt
                  - expiresAt
                  - qosStatus
