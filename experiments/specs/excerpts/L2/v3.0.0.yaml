openapi: 3.0.3
info:
  title: Device Location Verification
  version: 3.0.0
paths:
  /verify:
    post:
      tags:
      - Location verification
      summary: Verify the location of a device
      description: 'Verify whether the location of a device is within a requested area. The operation returns a verification
        result and, optionally, a match rate estimation for the location verification in percent.

        '
      operationId: verifyLocation
      parameters:
      - name: x-correlator
        in: header
        description: Correlation id for the different services
        schema:
          type: string
          pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
          example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Request to verify the location of a device. Device is not required when using a 3-legged access
                token, following the rules in the description.
              type: object
              properties:
                device:
                  description: 'End-user device able to connect to a mobile network. Examples of devices include smartphones
                    or IoT sensors/actuators.


                    The developer can choose to provide the below specified device identifiers:


                    * `ipv4Address`

                    * `ipv6Address`

                    * `phoneNumber`

                    * `networkAccessIdentifier`


                    NOTE1: the API provider might support only a subset of these options. The API consumer can provide multiple
                    identifiers to be compatible across different API providers. In this case the identifiers MUST belong
                    to the same device. Where more than one device identifier is provided, only one identifier will be selected
                    by the implementation and this choice indicated to the API consumer in the response.

                    NOTE2: as for this Commonalities release, we are enforcing that the networkAccessIdentifier is only part
                    of the schema for future-proofing, and CAMARA does not currently allow its use. After the CAMARA meta-release
                    work is concluded and the relevant issues are resolved, its use will need to be explicitly documented
                    in the guidelines.

                    '
                  type: object
                  properties:
                    phoneNumber:
                      description: A public identifier addressing a telephone subscription. In mobile networks it corresponds
                        to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally
                        unique it has to be formatted in international format, according to E.164 standard, prefixed with
                        '+'.
                      type: string
                      pattern: ^\+[1-9][0-9]{4,14}$
                      example: '+123456789'
                    networkAccessIdentifier:
                      description: A public identifier addressing a subscription in a mobile network. In 3GPP terminology,
                        it corresponds to the GPSI formatted with the External Identifier ({Local Identifier}@{Domain Identifier}).
                        Unlike the telephone number, the network access identifier is not subjected to portability ruling
                        in force, and is individually managed by each operator.
                      type: string
                      example: 123456789@domain.com
                    ipv4Address:
                      type: object
                      description: 'The device should be identified by either the public (observed) IP address and port as
                        seen by the application server, or the private (local) and any public (observed) IP addresses in use
                        by the device (this information can be obtained by various means, for example from some DNS servers).


                        If the allocated and observed IP addresses are the same (i.e. NAT is not in use) then  the same address
                        should be specified for both publicAddress and privateAddress.


                        If NAT64 is in use, the device should be identified by its publicAddress and publicPort, or separately
                        by its allocated IPv6 address (field ipv6Address of the Device object)


                        In all cases, publicAddress must be specified, along with at least one of either privateAddress or
                        publicPort, dependent upon which is known. In general, mobile devices cannot be identified by their
                        public IPv4 address alone.

                        '
                      properties:
                        publicAddress:
                          description: A single IPv4 address with no subnet mask
                          type: string
                          format: ipv4
                          example: 84.125.93.10
                        privateAddress:
                          description: A single IPv4 address with no subnet mask
                          type: string
                          format: ipv4
                          example: 84.125.93.10
                        publicPort:
                          description: TCP or UDP port number
                          type: integer
                          minimum: 0
                          maximum: 65535
                      anyOf:
                      - required:
                        - publicAddress
                        - privateAddress
                      - required:
                        - publicAddress
                        - publicPort
                      example:
                        publicAddress: 84.125.93.10
                        publicPort: 59765
                    ipv6Address:
                      description: 'The device should be identified by the observed IPv6 address, or by any single IPv6 address
                        from within the subnet allocated to the device (e.g. adding ::0 to the /64 prefix).

                        '
                      type: string
                      format: ipv6
                      example: 2001:db8:85a3:8d3:1319:8a2e:370:7344
                  minProperties: 1
                area:
                  description: Base schema for all areas
                  type: object
                  properties:
                    areaType:
                      type: string
                      description: 'Type of this area.

                        CIRCLE - The area is defined as a circle.

                        '
                      enum:
                      - CIRCLE
                  required:
                  - areaType
                  discriminator:
                    propertyName: areaType
                    mapping:
                      CIRCLE: '#/components/schemas/Circle'
                  x-discriminator-subtypes:
                    CIRCLE:
                      description: Circular area
                      allOf:
                      - type: object
                        properties:
                          center:
                            type: object
                            description: Coordinates (latitude, longitude) defining a location in a map
                            required:
                            - latitude
                            - longitude
                            properties:
                              latitude:
                                description: Latitude component of a location
                                type: number
                                format: double
                                minimum: -90
                                maximum: 90
                                example: 50.735851
                              longitude:
                                description: Longitude component of location
                                type: number
                                format: double
                                minimum: -180
                                maximum: 180
                                example: 7.10066
                            example:
                              latitude: 50.735851
                              longitude: 7.10066
                          radius:
                            type: number
                            description: 'Expected accuracy for the verification, in meters from `center`.

                              Note: The area surface could be restricted locally depending on regulations. Implementations
                              may enforce a larger minimum radius (e.g. 1000 meters).

                              '
                            minimum: 1
                        required:
                        - center
                        - radius
                      example:
                        areaType: CIRCLE
                        center:
                          latitude: 50.735851
                          longitude: 7.10066
                        radius: 50000
                maxAge:
                  description: The maximum age (in seconds) for the location known by the implementation, which is accepted
                    for the verification. Absence of maxAge means "any age" and maxAge=0 means a fresh calculation.
                  type: integer
                  example: 120
              required:
              - area
            examples:
              INPUT_PHONE_NUMBER_CIRCLE:
                summary: Phone number, circle and maxAge
                description: Verify if device identified by a phone number is within a circle, providing a maxAge
                value:
                  device:
                    phoneNumber: '+123456789'
                  area:
                    areaType: CIRCLE
                    center:
                      latitude: 50.735851
                      longitude: 7.10066
                    radius: 50000
                  maxAge: 120
              INPUT_IP_ADDRESS_V4_CIRCLE:
                summary: IPv4 address, circle, without maxAge
                description: Verify if device identified by an IPv4 address is within a circle, not indicating a maxAge
                value:
                  device:
                    ipv4Address:
                      publicAddress: 123.234.1.2
                      publicPort: 1234
                  area:
                    areaType: CIRCLE
                    center:
                      latitude: 50.735851
                      longitude: 7.10066
                    radius: 50000
              INPUT_PHONE_NUMBER_IP_ADDRESS_V4_CIRCLE:
                summary: Both phone number and IPv4 address, circle and maxAge
                description: Verify if device identified both by a phone number and an IPv4 address is within a circle, providing
                  a maxAge
                value:
                  device:
                    phoneNumber: '+123456789'
                    ipv4Address:
                      publicAddress: 123.234.1.2
                      publicPort: 1234
                  area:
                    areaType: CIRCLE
                    center:
                      latitude: 50.735851
                      longitude: 7.10066
                    radius: 50000
                  maxAge: 120
              INPUT_NO_DEVICE:
                summary: Device not provided
                description: The device has to be deducted from token
                value:
                  area:
                    areaType: CIRCLE
                    center:
                      latitude: 50.735851
                      longitude: 7.10066
                    radius: 50000
                  maxAge: 120
      responses:
        '200':
          description: Location verification result
          headers:
            x-correlator:
              description: Correlation id for the different services
              schema:
                type: string
                pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
                example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
          content:
            application/json:
              schema:
                description: Response to a location verification request
                type: object
                required:
                - verificationResult
                - lastLocationTime
                properties:
                  verificationResult:
                    description: "Result of a verification request:\n  - `TRUE`: when the network locates the device within\
                      \ the requested area,\n  - `FALSE`: when the requested area does not match the area where the network\
                      \ locates the device,\n  - `PARTIAL`: when the requested area partially match the area where the network\
                      \ locates the device. A `match_rate` is included in the response.\n"
                    type: string
                    enum:
                    - 'TRUE'
                    - 'FALSE'
                    - PARTIAL
                  lastLocationTime:
                    description: Timestamp of the last location information. It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6)
                      and must have time zone.
                    example: '2023-09-07T10:40:52Z'
                    format: date-time
                    type: string
                  matchRate:
                    description: Estimation of the match rate between the area in the request (R), and area where the network
                      locates the device (N), calculated as the percent value of the intersection of both areas divided by
                      the network area, that is (R ∩ N) / N * 100. Included only if VerificationResult is PARTIAL.
                    type: integer
                    minimum: 1
                    maximum: 99
                  device:
                    description: 'An identifier for the end-user equipment able to connect to the network that the response
                      refers to. This parameter is only returned when the API consumer includes the `device` parameter in
                      their request (i.e. they are using a two-legged access token), and is relevant when more than one device
                      identifier is specified, as only one of those device identifiers is allowed in the response.

                      If the API consumer provides more than one device identifier in their request, the API provider must
                      return a single identifier which is the one they are using to fulfil the request, even if the identifiers
                      do not match the same device. API provider does not perform any logic to validate/correlate that the
                      indicated device identifiers match the same device. No error should be returned if the identifiers are
                      otherwise valid to prevent API consumers correlating different identifiers with a given end user.

                      '
                    allOf:
                    - description: 'End-user device able to connect to a mobile network. Examples of devices include smartphones
                        or IoT sensors/actuators.


                        The developer can choose to provide the below specified device identifiers:


                        * `ipv4Address`

                        * `ipv6Address`

                        * `phoneNumber`

                        * `networkAccessIdentifier`


                        NOTE1: the API provider might support only a subset of these options. The API consumer can provide
                        multiple identifiers to be compatible across different API providers. In this case the identifiers
                        MUST belong to the same device. Where more than one device identifier is provided, only one identifier
                        will be selected by the implementation and this choice indicated to the API consumer in the response.

                        NOTE2: as for this Commonalities release, we are enforcing that the networkAccessIdentifier is only
                        part of the schema for future-proofing, and CAMARA does not currently allow its use. After the CAMARA
                        meta-release work is concluded and the relevant issues are resolved, its use will need to be explicitly
                        documented in the guidelines.

                        '
                      type: object
                      properties:
                        phoneNumber:
                          description: A public identifier addressing a telephone subscription. In mobile networks it corresponds
                            to the MSISDN (Mobile Station International Subscriber Directory Number). In order to be globally
                            unique it has to be formatted in international format, according to E.164 standard, prefixed with
                            '+'.
                          type: string
                          pattern: ^\+[1-9][0-9]{4,14}$
                          example: '+123456789'
                        networkAccessIdentifier:
                          description: A public identifier addressing a subscription in a mobile network. In 3GPP terminology,
                            it corresponds to the GPSI formatted with the External Identifier ({Local Identifier}@{Domain
                            Identifier}). Unlike the telephone number, the network access identifier is not subjected to portability
                            ruling in force, and is individually managed by each operator.
                          type: string
                          example: 123456789@domain.com
                        ipv4Address:
                          type: object
                          description: 'The device should be identified by either the public (observed) IP address and port
                            as seen by the application server, or the private (local) and any public (observed) IP addresses
                            in use by the device (this information can be obtained by various means, for example from some
                            DNS servers).


                            If the allocated and observed IP addresses are the same (i.e. NAT is not in use) then  the same
                            address should be specified for both publicAddress and privateAddress.


                            If NAT64 is in use, the device should be identified by its publicAddress and publicPort, or separately
                            by its allocated IPv6 address (field ipv6Address of the Device object)


                            In all cases, publicAddress must be specified, along with at least one of either privateAddress
                            or publicPort, dependent upon which is known. In general, mobile devices cannot be identified
                            by their public IPv4 address alone.

                            '
                          properties:
                            publicAddress:
                              description: A single IPv4 address with no subnet mask
                              type: string
                              format: ipv4
                              example: 84.125.93.10
                            privateAddress:
                              description: A single IPv4 address with no subnet mask
                              type: string
                              format: ipv4
                              example: 84.125.93.10
                            publicPort:
                              description: TCP or UDP port number
                              type: integer
                              minimum: 0
                              maximum: 65535
                          anyOf:
                          - required:
                            - publicAddress
                            - privateAddress
                          - required:
                            - publicAddress
                            - publicPort
                          example:
                            publicAddress: 84.125.93.10
                            publicPort: 59765
                        ipv6Address:
                          description: 'The device should be identified by the observed IPv6 address, or by any single IPv6
                            address from within the subnet allocated to the device (e.g. adding ::0 to the /64 prefix).

                            '
                          type: string
                          format: ipv6
                          example: 2001:db8:85a3:8d3:1319:8a2e:370:7344
                      minProperties: 1
                    - maxProperties: 1
              examples:
                VERIFICATION_TRUE:
                  summary: Match
                  description: The network locates the device within the requested area
                  value:
                    verificationResult: 'TRUE'
                    lastLocationTime: '2023-09-07T10:40:52Z'
                VERIFICATION_TRUE_WITH_DEVICE:
                  summary: Match returning the device identifier used by the implementation
                  description: The network locates the device within the requested area. Response when the request used a
                    2-legged access token with multiple device identifiers, or possibly only a single device identifier
                  value:
                    verificationResult: 'TRUE'
                    lastLocationTime: '2023-09-07T10:40:52Z'
                    device:
                      phoneNumber: '+123456789'
                VERIFICATION_FALSE:
                  summary: No match
                  description: The requested area does not match the area where the network locates the device
                  value:
                    verificationResult: 'FALSE'
                    lastLocationTime: '2023-09-07T10:40:52Z'
                VERIFICATION_PARTIAL:
                  summary: Partial match
                  description: The requested area partially matches the area where the network locates the device
                  value:
                    verificationResult: PARTIAL
                    matchRate: 74
                    lastLocationTime: '2023-09-07T10:40:52Z'
        '400':
          description: Bad Request
          headers:
            x-correlator:
              description: Correlation id for the different services
              schema:
                type: string
                pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
                example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
          content:
            application/json:
              schema:
                allOf:
                - description: Common schema for errors
                  type: object
                  required:
                  - status
                  - code
                  - message
                  properties:
                    status:
                      type: integer
                      description: HTTP response status code
                    code:
                      type: string
                      description: A human-readable code to describe the error
                    message:
                      type: string
                      description: A human-readable description of what the event represents
                - type: object
                  properties:
                    status:
                      enum:
                      - 400
                    code:
                      enum:
                      - INVALID_ARGUMENT
                      - OUT_OF_RANGE
              examples:
                GENERIC_400_INVALID_ARGUMENT:
                  description: Invalid Argument. Generic Syntax Exception
                  value:
                    status: 400
                    code: INVALID_ARGUMENT
                    message: Client specified an invalid argument, request body or query param.
                GENERIC_400_OUT_OF_RANGE:
                  description: Out of Range. Specific Syntax Exception used when a given field has a pre-defined range or
                    a invalid filter criteria combination is requested
                  value:
                    status: 400
                    code: OUT_OF_RANGE
                    message: Client specified an invalid range.
        '401':
          description: Unauthorized
          headers:
            x-correlator:
              description: Correlation id for the different services
              schema:
                type: string
                pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
                example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
          content:
            application/json:
              schema:
                allOf:
                - description: Common schema for errors
                  type: object
                  required:
                  - status
                  - code
                  - message
                  properties:
                    status:
                      type: integer
                      description: HTTP response status code
                    code:
                      type: string
                      description: A human-readable code to describe the error
                    message:
                      type: string
                      description: A human-readable description of what the event represents
                - type: object
                  properties:
                    status:
                      enum:
                      - 401
                    code:
                      enum:
                      - UNAUTHENTICATED
              examples:
                GENERIC_401_UNAUTHENTICATED:
                  description: Request cannot be authenticated and a new authentication is required
                  value:
                    status: 401
                    code: UNAUTHENTICATED
                    message: Request not authenticated due to missing, invalid, or expired credentials. A new authentication
                      is required.
        '403':
          description: Forbidden
          headers:
            x-correlator:
              description: Correlation id for the different services
              schema:
                type: string
                pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
                example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
          content:
            application/json:
              schema:
                allOf:
                - description: Common schema for errors
                  type: object
                  required:
                  - status
                  - code
                  - message
                  properties:
                    status:
                      type: integer
                      description: HTTP response status code
                    code:
                      type: string
                      description: A human-readable code to describe the error
                    message:
                      type: string
                      description: A human-readable description of what the event represents
                - type: object
                  properties:
                    status:
                      enum:
                      - 403
                    code:
                      enum:
                      - PERMISSION_DENIED
              examples:
                GENERIC_403_PERMISSION_DENIED:
                  description: Permission denied. OAuth2 token access does not have the required scope or when the user fails
                    operational security
                  value:
                    status: 403
                    code: PERMISSION_DENIED
                    message: Client does not have sufficient permissions to perform this action.
        '404':
          description: Not found
          headers:
            x-correlator:
              description: Correlation id for the different services
              schema:
                type: string
                pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
                example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
          content:
            application/json:
              schema:
                allOf:
                - description: Common schema for errors
                  type: object
                  required:
                  - status
                  - code
                  - message
                  properties:
                    status:
                      type: integer
                      description: HTTP response status code
                    code:
                      type: string
                      description: A human-readable code to describe the error
                    message:
                      type: string
                      description: A human-readable description of what the event represents
                - type: object
                  properties:
                    status:
                      enum:
                      - 404
                    code:
                      enum:
                      - IDENTIFIER_NOT_FOUND
              examples:
                GENERIC_404_IDENTIFIER_NOT_FOUND:
                  description: Some identifier cannot be matched to a device
                  value:
                    status: 404
                    code: IDENTIFIER_NOT_FOUND
                    message: Device identifier not found.
        '422':
          description: Unprocessable Content
          headers:
            x-correlator:
              description: Correlation id for the different services
              schema:
                type: string
                pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
                example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
          content:
            application/json:
              schema:
                allOf:
                - description: Common schema for errors
                  type: object
                  required:
                  - status
                  - code
                  - message
                  properties:
                    status:
                      type: integer
                      description: HTTP response status code
                    code:
                      type: string
                      description: A human-readable code to describe the error
                    message:
                      type: string
                      description: A human-readable description of what the event represents
                - type: object
                  properties:
                    status:
                      enum:
                      - 422
                    code:
                      enum:
                      - SERVICE_NOT_APPLICABLE
                      - MISSING_IDENTIFIER
                      - UNSUPPORTED_IDENTIFIER
                      - UNNECESSARY_IDENTIFIER
                      - LOCATION_VERIFICATION.AREA_NOT_COVERED
                      - LOCATION_VERIFICATION.INVALID_AREA
                      - LOCATION_VERIFICATION.UNABLE_TO_FULFILL_MAX_AGE
                      - LOCATION_VERIFICATION.UNABLE_TO_LOCATE
              examples:
                GENERIC_422_SERVICE_NOT_APPLICABLE:
                  description: Service not applicable for the provided identifier
                  value:
                    status: 422
                    code: SERVICE_NOT_APPLICABLE
                    message: The service is not available for the provided identifier.
                GENERIC_422_MISSING_IDENTIFIER:
                  description: An identifier is not included in the request and the device or phone number identification
                    cannot be derived from the 3-legged access token
                  value:
                    status: 422
                    code: MISSING_IDENTIFIER
                    message: The device cannot be identified.
                GENERIC_422_UNSUPPORTED_IDENTIFIER:
                  description: None of the provided identifiers is supported by the implementation
                  value:
                    status: 422
                    code: UNSUPPORTED_IDENTIFIER
                    message: The identifier provided is not supported.
                GENERIC_422_UNNECESSARY_IDENTIFIER:
                  description: An explicit identifier is provided when a device or phone number has already been identified
                    from the access token
                  value:
                    status: 422
                    code: UNNECESSARY_IDENTIFIER
                    message: The device is already identified by the access token.
                LOCATION_VERIFICATION_422_AREA_NOT_COVERED:
                  summary: The area cannot be covered
                  description: The system is not able cover the requested area
                  value:
                    status: 422
                    code: LOCATION_VERIFICATION.AREA_NOT_COVERED
                    message: Unable to cover the requested area
                LOCATION_VERIFICATION_422_INVALID_AREA:
                  summary: Invalid area
                  description: The requested area is too small to be supported by the system.
                  value:
                    status: 422
                    code: LOCATION_VERIFICATION.INVALID_AREA
                    message: The requested area is too small
                LOCATION_VERIFICATION_422_UNABLE_TO_FULFILL_MAX_AGE:
                  summary: Unable to fulfill maxAge
                  description: The system is not able to provide the fresh location required by the client
                  value:
                    status: 422
                    code: LOCATION_VERIFICATION.UNABLE_TO_FULFILL_MAX_AGE
                    message: Unable to provide expected freshness for location
                LOCATION_VERIFICATION_422_UNABLE_TO_LOCATE:
                  summary: Unable to locate device
                  description: The network cannot locate the device
                  value:
                    status: 422
                    code: LOCATION_VERIFICATION.UNABLE_TO_LOCATE
                    message: The network is unable to locate the device
servers:
- url: '{apiRoot}/location-verification/v3'
  variables:
    apiRoot:
      default: http://localhost:9091
      description: API root
