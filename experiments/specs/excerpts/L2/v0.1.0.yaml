openapi: 3.0.3
info:
  title: Device location API
  version: 0.1.0
paths:
  /verify:
    post:
      tags:
      - Location verification
      summary: Execute location verification for a user equipment
      operationId: verifyLocation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ueId:
                  description: User equipment identifier
                  type: object
                  properties:
                    externalId:
                      type: string
                      example: 123456789@domain.com
                    msisdn:
                      type: string
                      pattern: ^\+?[0-9]{5,15}$
                      example: '123456789'
                      description: Subscriber number in E.164 format (starting with country code). Optionally prefixed with
                        '+'.
                    ipv4Addr:
                      type: string
                      format: ipv4
                      pattern: ^([01]?\d\d?|2[0-4]\d|25[0-5])(?:\.(?:[01]?\d\d?|2[0-4]\d|25[0-5])){3}(\/([0-9]|[1-2][0-9]|3[0-2]))?$
                      example: 192.168.0.1/24
                      description: "IPv4 address may be specified in form <address/mask> as:\n  - address - an IPv4 number\
                        \ in dotted-quad form 1.2.3.4. Only this exact IP number will match the flow control rule.\n  - address/mask\
                        \ - an IP number as above with a mask width of the form 1.2.3.4/24.\n    In this case, all IP numbers\
                        \ from 1.2.3.0 to 1.2.3.255 will match. The bit width MUST be valid for the IP version.\n"
                    ipv6Addr:
                      type: string
                      format: ipv6
                      allOf:
                      - pattern: ^((:|(0?|([1-9a-f][0-9a-f]{0,3}))):)((0?|([1-9a-f][0-9a-f]{0,3})):){0,6}(:|(0?|([1-9a-f][0-9a-f]{0,3})))(\/(([0-9])|([0-9]{2})|(1[0-1][0-9])|(12[0-8])))?$
                      - pattern: ^((([^:]+:){7}([^:]+))|((([^:]+:)*[^:]+)?::(([^:]+:)*[^:]+)?))(\/.+)?$
                      example: 2001:db8:85a3:8d3:1319:8a2e:370:7344
                      description: "IPv6 address, following IETF 5952 format, may be specified in form <address/mask> as:\n\
                        \  - address - The /128 subnet is optional for single addresses:\n    - 2001:db8:85a3:8d3:1319:8a2e:370:7344\n\
                        \    - 2001:db8:85a3:8d3:1319:8a2e:370:7344/128\n  - address/mask - an IP v6 number with a mask:\n\
                        \    - 2001:db8:85a3:8d3::0/64\n    - 2001:db8:85a3:8d3::/64\n"
                  minProperties: 1
                uePort:
                  type: integer
                  minimum: 0
                  maximum: 65535
                  description: User equipment port. Device port may be required along with IP address to identify the target
                    device
                  example: 5060
                latitude:
                  description: Latitude component of location
                  type: number
                  format: double
                  minimum: -90
                  maximum: 90
                  example: 50.735851
                longitude:
                  description: Longitude component of location
                  type: number
                  format: double
                  minimum: -180
                  maximum: 180
                  example: 7.10066
                accuracy:
                  description: Accuracy expected for location verification in km
                  type: number
                  minimum: 2
                  maximum: 200
                  example: 50
              required:
              - ueId
              - latitude
              - longitude
              - accuracy
        required: true
      responses:
        '200':
          description: Location verification successful
          content:
            application/json:
              schema:
                type: object
                required:
                - verificationResult
                properties:
                  verificationResult:
                    description: Result of a verification request, true on match
                    type: boolean
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    description: Code given to this error
                  message:
                    type: string
                    description: Detailed error description
              example:
                code: INVALID_INPUT
                message: Invalid input
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    description: Code given to this error
                  message:
                    type: string
                    description: Detailed error description
              example:
                code: UNAUTHORIZED
                message: 'Authorization failed: ...'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    description: Code given to this error
                  message:
                    type: string
                    description: Detailed error description
              example:
                code: FORBIDDEN
                message: 'Operation not allowed: ...'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    description: Code given to this error
                  message:
                    type: string
                    description: Detailed error description
              example:
                code: NOT_FOUND
                message: The specified resource is not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    description: Code given to this error
                  message:
                    type: string
                    description: Detailed error description
              example:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    description: Code given to this error
                  message:
                    type: string
                    description: Detailed error description
              example:
                code: SERVICE_UNAVAILABLE
                message: Service unavailable
servers:
- url: '{apiRoot}/{basePath}'
  variables:
    apiRoot:
      default: http://localhost:9091
      description: API root
    basePath:
      default: location/v0
      description: Base path for the device location API
